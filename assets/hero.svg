<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Best Studio — Software Engineer</title>
  <desc id="desc">Low-level systems, game technologies and automation. C++, C# and Python. A dark navy banner with subtle animated signals travelling through a technical systems illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B101A"/>
      <stop offset="1" stop-color="#101D2C"/>
    </linearGradient>
    <linearGradient id="edge" x1="650" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#273A4E"/>
      <stop offset="1" stop-color="#65D9F5" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="core" x1="860" y1="100" x2="1040" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#193C50"/>
      <stop offset="1" stop-color="#0F1E2F"/>
    </linearGradient>
    <linearGradient id="accent" x1="62" y1="268" x2="718" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D9F5" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#65D9F5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(966 176) scale(252 219)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C6B83" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1C6B83" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#93B1C9" stroke-opacity="0.065"/>
    </pattern>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1199" height="359" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect x="738" width="462" height="360" fill="url(#grid)"/>
    <rect x="700" width="500" height="360" fill="url(#ambient)"/>
    <path d="M756 0L676 360" stroke="#435F76" stroke-opacity="0.16"/>
    <path d="M776 0L696 360" stroke="#435F76" stroke-opacity="0.06"/>
    <path d="M62 43H88" stroke="#65D9F5" stroke-width="3" stroke-linecap="round"/>
    <text x="102" y="49" class="mono" fill="#90A8BC" font-size="16" letter-spacing="2.1">YBESTSTUDIO / ENGINEERING</text>

    <text x="58" y="145" class="sans" fill="#F3F7FC" font-weight="700" font-size="67" letter-spacing="-2.3">BEST STUDIO<tspan fill="#65D9F5">.</tspan></text>
    <text x="62" y="190" class="sans" fill="#65D9F5" font-weight="500" font-size="28" letter-spacing="0.25">Software Engineer</text>
    <text x="63" y="228" class="sans" fill="#A2B3C5" font-size="19">Low-level systems · Game technologies · Automation</text>

    <path d="M62 268H718" stroke="url(#accent)"/>
    <g class="mono" font-size="15" letter-spacing="0.6">
      <rect x="62" y="290" width="64" height="30" rx="7" fill="#142330" stroke="#2B4052"/>
      <text x="94" y="310" text-anchor="middle" fill="#D5E5F0">C++</text>
      <rect x="138" y="290" width="58" height="30" rx="7" fill="#142330" stroke="#2B4052"/>
      <text x="167" y="310" text-anchor="middle" fill="#D5E5F0">C#</text>
      <rect x="208" y="290" width="90" height="30" rx="7" fill="#142330" stroke="#2B4052"/>
      <text x="253" y="310" text-anchor="middle" fill="#D5E5F0">Python</text>
    </g>

    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- Signal routes are visible before animation starts. -->
      <path d="M792 92H847L895 140" stroke="#38566D" stroke-width="1.5"/>
      <path d="M1045 140L1093 92H1134" stroke="#38566D" stroke-width="1.5"/>
      <path d="M1045 220L1093 268H1134" stroke="#38566D" stroke-width="1.5"/>
      <path d="M792 268H847L895 220" stroke="#38566D" stroke-width="1.5"/>
      <path d="M970 45V86M970 274V315" stroke="#2B455A" stroke-width="1.5"/>
      <path d="M806 180H859M1081 180H1134" stroke="#2B455A" stroke-width="1.5"/>

      <path d="M970 68L1082 180L970 292L858 180Z" stroke="#65D9F5" stroke-opacity="0.13"/>
      <path d="M970 90L1060 180L970 270L880 180Z" fill="#0D1C2A" stroke="url(#edge)" stroke-width="1.5"/>
      <path d="M970 110L1040 180L970 250L900 180Z" fill="url(#core)" stroke="#54879B" stroke-width="1.5"/>
      <path d="M970 125L1025 180L970 235L915 180Z" stroke="#65D9F5" stroke-opacity="0.12"/>

      <!-- A simple code glyph connects the systems motif to software. -->
      <path d="M952 160L932 180L952 200M988 160L1008 180L988 200M979 154L962 206" stroke="#8EE7F7" stroke-width="3.5"/>

      <g fill="#112536" stroke="#45657B" stroke-width="1.5">
        <rect x="786" y="86" width="12" height="12" rx="3"/>
        <rect x="1128" y="86" width="12" height="12" rx="3"/>
        <rect x="786" y="262" width="12" height="12" rx="3"/>
        <rect x="1128" y="262" width="12" height="12" rx="3"/>
      </g>
      <g fill="#65D9F5">
        <circle cx="970" cy="45" r="2.5" opacity="0.55"/>
        <circle cx="970" cy="315" r="2.5" opacity="0.55"/>
        <circle cx="806" cy="180" r="2.5" opacity="0.55"/>
        <circle cx="1134" cy="180" r="2.5" opacity="0.55"/>
      </g>

      <g class="motion">
        <circle r="3" fill="#8EE7F7" opacity="0">
          <animateMotion path="M792 92H847L895 140" dur="4.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.08;0.62;0.78;1" dur="4.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#8EE7F7" opacity="0">
          <animateMotion path="M1045 220L1093 268H1134" begin="1.8s" dur="4.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.08;0.62;0.78;1" begin="1.8s" dur="4.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.5" fill="#8EE7F7" opacity="0">
          <animateMotion path="M1134 92H1093L1045 140" begin="3.1s" dur="5.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.08;0.62;0.78;1" begin="3.1s" dur="5.6s" repeatCount="indefinite"/>
        </circle>
        <path d="M970 90L1060 180L970 270L880 180Z" stroke="#65D9F5" opacity="0.1">
          <animate attributeName="opacity" values="0.1;0.38;0.1" dur="5.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" stroke="#31445A" stroke-opacity="0.7"/>
</svg>
